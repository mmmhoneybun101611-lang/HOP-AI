<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Hop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #16121F;
            color: #F1EEFF;
            height: 100vh;
            overflow: hidden;
        }
        .app { display: flex; height: 100vh; }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            background: #1E1830;
            border-right: 1px solid #2E2645;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        .wordmark {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: baseline;
            gap: 2px;
        }
        .wordmark .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #726A8A;
            margin-left: 4px;
            animation: hop 1.1s ease-in-out infinite;
            transition: background 0.3s ease;
        }
        .wordmark .dot.online { background: #3FB950; }
        .wordmark .dot.offline { background: #F85149; }
        @keyframes hop {
            0%, 100% { transform: translateY(0); }
            35% { transform: translateY(-7px); }
            55% { transform: translateY(0); }
        }
        .new-chat-btn {
            background: linear-gradient(135deg, #FFA23A, #FF7A5C);
            color: #16121F;
            border: none;
            border-radius: 999px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            transition: transform 0.15s ease;
        }
        .new-chat-btn:hover { transform: translateY(-2px); }
        .new-chat-btn:active { transform: translateY(0); }

        .history-list { overflow-y: auto; flex: 1; }
        .history-item {
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #9C93B8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            transition: background 0.15s ease, color 0.15s ease;
            position: relative;
        }
        .history-item span.title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .history-item:hover { background: #2E2645; color: #F1EEFF; }
        .history-item.active { background: #2E2645; color: #FFA23A; }
        .history-menu-btn {
            background: none;
            border: none;
            color: #726A8A;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        .history-item:hover .history-menu-btn { display: block; }
        .history-menu-btn:hover { background: #322A4A; color: #F1EEFF; }
        .history-dropdown {
            position: absolute;
            right: 8px;
            top: 32px;
            background: #241D38;
            border: 1px solid #322A4A;
            border-radius: 8px;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .history-dropdown button {
            display: block;
            width: 100%;
            padding: 8px 16px;
            background: none;
            border: none;
            color: #FF6B6B;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }
        .history-dropdown button:hover { background: #322A4A; }

        /* --- Main --- */
        .main { flex: 1; display: flex; flex-direction: column; }
        .header {
            padding: 18px 24px;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 17px;
            border-bottom: 1px solid #2E2645;
            color: #F1EEFF;
        }

        .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
        .bubble {
            max-width: 68%;
            padding: 12px 16px;
            font-size: 14.5px;
            line-height: 1.55;
            white-space: pre-wrap;
            animation: land 0.28s cubic-bezier(.34, 1.56, .64, 1);
        }
        @keyframes land {
            0% { transform: translateY(10px) scale(0.97); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #FFA23A, #FF7A5C);
            color: #16121F;
            font-weight: 500;
            border-radius: 16px 16px 4px 16px;
        }
        .bubble.ai {
            align-self: flex-start;
            background: #241D38;
            color: #F1EEFF;
            border-radius: 16px 16px 16px 4px;
            border: 1px solid #322A4A;
        }

        .thinking { display: flex; gap: 4px; align-self: flex-start; padding: 12px 16px; }
        .thinking span {
            width: 6px; height: 6px; border-radius: 50%;
            background: #8B7FFF;
            animation: hop 1s ease-in-out infinite;
        }
        .thinking span:nth-child(2) { animation-delay: 0.15s; }
        .thinking span:nth-child(3) { animation-delay: 0.3s; }

        .input-row { display: flex; padding: 18px 24px; border-top: 1px solid #2E2645; gap: 10px; }
        #message-input {
            flex: 1;
            background: #1E1830;
            border: 1px solid #322A4A;
            border-radius: 999px;
            padding: 12px 18px;
            color: #F1EEFF;
            font-size: 14px;
        }
        #message-input:focus { outline: none; border-color: #8B7FFF; }
        #message-input::placeholder { color: #726A8A; }
        #send-btn {
            background: linear-gradient(135deg, #8B7FFF, #6D5DFF);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 12px 22px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.15s ease;
        }
        #send-btn:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="wordmark">Hop<span class="dot"></span></div>
            <button id="new-chat-btn" class="new-chat-btn">+ New chat</button>
            <div id="history-list" class="history-list"></div>
        </div>

        <div class="main">
            <div class="header">Hop</div>
            <div id="messages" class="messages"></div>
            <div class="input-row">
                <input id="message-input" type="text" placeholder="Message Hop..." autocomplete="off" />
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        // ============================================================
        // UPDATE THIS every time you rerun Cell 3 in Colab — the link
        // changes each time. Copy the "Running on public URL:" link
        // from Colab's output and paste it here, no trailing slash.
        // ============================================================
        const GRADIO_SERVER_URL = "https://PASTE-YOUR-LINK-HERE.gradio.live";

        const PERSONA = "### System:\nYou are Hop AI, a helpful and friendly AI assistant. You answer clearly and stay consistent about who you are.\n\n";

        let chats = JSON.parse(localStorage.getItem("hopai_chats") || "[]");
        let currentChatIndex = chats.length > 0 ? 0 : createNewChat();

        function createNewChat() {
            chats.unshift({ title: "New chat", messages: [] });
            saveChats();
            return 0;
        }

        function saveChats() {
            localStorage.setItem("hopai_chats", JSON.stringify(chats));
        }

        function closeAllDropdowns() {
            document.querySelectorAll(".history-dropdown").forEach((el) => el.remove());
        }

        function deleteChat(index) {
            chats.splice(index, 1);
            if (chats.length === 0) {
                currentChatIndex = createNewChat();
            } else if (currentChatIndex >= chats.length) {
                currentChatIndex = chats.length - 1;
            } else if (currentChatIndex === index) {
                currentChatIndex = Math.max(0, index - 1);
            } else if (currentChatIndex > index) {
                currentChatIndex -= 1;
            }
            saveChats();
            renderMessages();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById("history-list");
            list.innerHTML = "";
            chats.forEach((chat, i) => {
                const item = document.createElement("div");
                item.className = "history-item" + (i === currentChatIndex ? " active" : "");

                const titleSpan = document.createElement("span");
                titleSpan.className = "title";
                titleSpan.textContent = chat.title;
                titleSpan.onclick = () => {
                    currentChatIndex = i;
                    renderMessages();
                    renderHistory();
                };

                const menuBtn = document.createElement("button");
                menuBtn.className = "history-menu-btn";
                menuBtn.textContent = "⋮";
                menuBtn.onclick = (e) => {
                    e.stopPropagation();
                    const alreadyOpen = item.querySelector(".history-dropdown");
                    closeAllDropdowns();
                    if (alreadyOpen) return;

                    const dropdown = document.createElement("div");
                    dropdown.className = "history-dropdown";
                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "Delete permanently";
                    deleteBtn.onclick = (ev) => {
                        ev.stopPropagation();
                        closeAllDropdowns();
                        deleteChat(i);
                    };
                    dropdown.appendChild(deleteBtn);
                    item.appendChild(dropdown);
                };

                item.appendChild(titleSpan);
                item.appendChild(menuBtn);
                list.appendChild(item);
            });
        }

        document.addEventListener("click", closeAllDropdowns);

        function renderMessages() {
            const container = document.getElementById("messages");
            container.innerHTML = "";
            const chat = chats[currentChatIndex];
            chat.messages.forEach((msg) => {
                const bubble = document.createElement("div");
                bubble.className = "bubble " + (msg.role === "user" ? "user" : "ai");
                bubble.textContent = msg.text;
                container.appendChild(bubble);
            });
            container.scrollTop = container.scrollHeight;
        }

        function showThinking() {
            const container = document.getElementById("messages");
            const el = document.createElement("div");
            el.className = "thinking";
            el.id = "thinking-indicator";
            el.innerHTML = "<span></span><span></span><span></span>";
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        function hideThinking() {
            const el = document.getElementById("thinking-indicator");
            if (el) el.remove();
        }

        async function askServer(message, historyPairs) {
            const postResponse = await fetch(`${GRADIO_SERVER_URL}/gradio_api/call/chat`, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    data: [message, JSON.stringify(historyPairs), getClientId()],
                    session_hash: getClientId(),
                }),
            });
            const postResult = await postResponse.json();
            const eventId = postResult.event_id;
            if (!eventId) {
                throw new Error("No event_id returned from server: " + JSON.stringify(postResult));
            }

            const getResponse = await fetch(`${GRADIO_SERVER_URL}/gradio_api/call/chat/${eventId}`);
            const rawText = await getResponse.text();

            let lastData = null;
            for (const line of rawText.split("\n")) {
                if (line.startsWith("data:")) {
                    try {
                        lastData = JSON.parse(line.slice(5).trim());
                    } catch (e) {
                        // ignore lines that aren't valid JSON
                    }
                }
            }

            if (Array.isArray(lastData) && lastData.length > 0) {
                return lastData[0];
            }
            throw new Error("No valid response data found in server stream");
        }

        async function handleSend() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";

            const chat = chats[currentChatIndex];
            chat.messages.push({ role: "user", text });
            if (chat.title === "New chat") chat.title = text.slice(0, 30);
            renderMessages();
            renderHistory();
            saveChats();
            showThinking();

            const historyPairs = [];
            for (let i = 0; i < chat.messages.length - 1; i += 2) {
                historyPairs.push([chat.messages[i].text, chat.messages[i + 1].text]);
            }

            let reply;
            try {
                reply = await askServer(text, historyPairs);
            } catch (err) {
                console.error("Hop AI request failed:", err);
                reply = "SERVERS ARE DOWN PLEASE COME BACK LATER";
            }

            hideThinking();
            chat.messages.push({ role: "ai", text: reply });
            renderMessages();
            saveChats();
        }

        document.getElementById("send-btn").onclick = handleSend;
        document.getElementById("message-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") handleSend();
        });
        document.getElementById("new-chat-btn").onclick = () => {
            currentChatIndex = createNewChat();
            renderMessages();
            renderHistory();
        };

        async function checkServerStatus() {
            const dot = document.querySelector(".wordmark .dot");
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            try {
                const response = await fetch(`${GRADIO_SERVER_URL}/config`, {
                    signal: controller.signal,
                    cache: "no-store",
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("Bad status");

                const data = await response.json();
                const looksReal =
                    data &&
                    typeof data.mode === "string" &&
                    Array.isArray(data.components) &&
                    data.components.length > 0;

                if (looksReal) {
                    dot.classList.remove("offline");
                    dot.classList.add("online");
                } else {
                    throw new Error("Response did not look like real Gradio config");
                }
            } catch (err) {
                clearTimeout(timeoutId);
                dot.classList.remove("online");
                dot.classList.add("offline");
            }
        }

        function getClientId() {
            let clientId = localStorage.getItem("hopai_client_id");
            if (!clientId) {
                clientId = "client_" + crypto.randomUUID();
                localStorage.setItem("hopai_client_id", clientId);
            }
            return clientId;
        }

        checkServerStatus();
        setInterval(checkServerStatus, 1000);

        renderMessages();
        renderHistory();
    </script>
</body>
</html>
